function applyPercentValues(root){

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function fmtDate(iso){ const d=new Date(iso); if(isNaN(d)) return ""; return d.getDate()+" "+MONTHS[d.getMonth()]+", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function dayKey(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function ago(ts){ const m=Math.round((Date.now()-ts)/60000); if(m<1) return "только что"; if(m<60) return m+" мин назад"; const h=Math.round(m/60); if(h<24) return h+" ч назад"; return Math.round(h/24)+" дн назад"; }
function plural(n, a, b, c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",3200); }
function md(text){
  const lines=esc(text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/);
  let out="", inList=false;
  for(const l of lines){
    const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!inList){out+="<ul>";inList=true;} out+="<li>"+m[1]+"</li>"; }
    else { if(inList){out+="</ul>";inList=false;} if(l.trim()) out+="<p>"+l.replace(/^#+\s*/,"")+"</p>"; }
  }
  if(inList) out+="</ul>"; return out;
}

/* ============ storage layer (db capability, or local fallback) ============ */
const LOCAL_KEY="taza_local_v1";
let LOCAL = (()=>{ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY))||{} }catch{ return {} } })();
const localSubs = {};
function saveLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(LOCAL)) }catch{} }
function splitPath(p){ const i=p.lastIndexOf("/"); return [p.slice(0,i), p.slice(i+1)]; }
function localList(col){ return Object.entries(LOCAL[col]||{}).map(([id,v])=>({id,...v})); }
function localEmit(col){ (localSubs[col]||[]).forEach(cb=>cb(localList(col))); }
const Store = {
  sub(col, cb){
    if(S.db) return S.db.collection(col).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>console.warn("db",col,e&&e.code));
    (localSubs[col] ||= []).push(cb); cb(localList(col));
  },
  async get(path){
    if(S.db){ const s=await S.db.doc(path).get(); return s.exists ? {...s.data()} : null; }
    const [c,id]=splitPath(path); const v=(LOCAL[c]||{})[id]; return v?JSON.parse(JSON.stringify(v)):null;
  },
  async set(path, data){
    if(S.db) return S.db.doc(path).set(data);
    const [c,id]=splitPath(path); (LOCAL[c] ||= {})[id]=data; saveLocal(); localEmit(c);
  },
  async update(path, patch){
    if(S.db) return S.db.doc(path).update(patch);
    const [c,id]=splitPath(path); (LOCAL[c] ||= {}); LOCAL[c][id]={...(LOCAL[c][id]||{}),...patch}; saveLocal(); localEmit(c);
  },
  async add(col, data){ const id=rid(); await this.set(col+"/"+id, data); return id; },
};
const privPath = () => "data/users/"+S.uid+"/me";

async function saveMe(pub, priv){

}

/* photo → small jpeg blob + thumbnail dataURL */
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=u; }); }
async function processPhoto(file){
  const im=await loadImg(file);
  const draw=(max,q)=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); return c; };
  const big=draw(1024); const blob=await new Promise(r=>big.toBlob(r,"image/jpeg",0.82));
  const thumb=draw(360).toDataURL("image/jpeg",0.7);
  return {blob, thumb};
}

async function setSampleCapability(sample){
  S.sample=sample||null;
  S.imgOK=false;
  if(S.sample){
    try{ const lim=await S.sample.limits(); S.imgOK=!!(lim&&lim.images); }
    catch(e){ console.warn("Claude image capability",e); }
  }
  renderTop();
  if(S.pub) renderCurrent();
}
async function boot(){
  $("#splashLogo").innerHTML=LOGO; $("#topLogo").innerHTML=LOGO;
  let db=null, user=null, sample=null;
  if(window.claude && typeof window.claude.use==="function"){
    const capability=name=>Promise.resolve()
      .then(()=>window.claude.use(name))
      .then(value=>({value}),error=>({error}));
    const dbRequest=capability("db"), userRequest=capability("user"), sampleRequest=capability("sample");
    const requests=Promise.all([dbRequest,userRequest,sampleRequest]);
    const timedOut=Symbol("timeout");
    const results=await Promise.race([requests,new Promise(resolve=>setTimeout(()=>resolve(timedOut),9000))]);
    if(results===timedOut){
      S.aiError="Claude capability startup timed out";
      console.warn("Claude capabilities are taking longer than expected");
      sampleRequest.then(async result=>{
        if(result.error){ console.warn("Claude sample capability",result.error); return; }
        await setSampleCapability(result.value);
        S.aiError=null;
      });
    }else{
      const [dbResult,userResult,sampleResult]=results;
      if(dbResult.error) console.warn("Claude db capability",dbResult.error); else db=dbResult.value;
      if(userResult.error) console.warn("Claude user capability",userResult.error); else user=userResult.value;
      if(sampleResult.error){ S.aiError=sampleResult.error; console.warn("Claude sample capability",sampleResult.error); }
      else sample=sampleResult.value;
    }
  }
  S.db=db; S.user=user; S.local=!db;
  if(sample) await setSampleCapability(sample);
  try{ S.uid = user ? await user.id() : null; }catch{}
  if(!S.uid){ try{ S.uid=localStorage.getItem("taza_uid"); }catch{} if(!S.uid){ S.uid="local-"+rid(); try{localStorage.setItem("taza_uid",S.uid)}catch{} } }
  if(!S.db) S.local=true;
  let pub=null, priv=null;
  try{ pub=await Store.get("profiles/"+S.uid); priv=await Store.get(privPath()); }catch(e){ console.warn(e); }
  $("#splash").hidden=true;
  if(pub && pub.name){ S.pub=pub; S.priv=priv||{}; applySeniorDefaultView(); startApp(); }
  else startOnboarding();
}

  try{ localStorage.setItem(SIMPLE_VIEW_KEY,String(S.simpleView)); }
  catch(e){ console.warn("Could not save simple view preference",e); toast("Настройка действует только до закрытия страницы"); }
  applySimpleView();
  if(S.simpleView&&!["home","map","events"].includes(S.tab)){ go("home"); return; }
  renderTabs();
  renderCurrent();
  $("#fab").hidden=S.simpleView||S.tab==="ai";
  MAP.setActive(S.tab==="map");
}
function balance(){ return (S.pub?.points||0)-(S.priv?.spent||0); }
function renderTop(){
  $("#pointsPill").innerHTML=`${I.coin}<span class="num">${balance()}</span>`;
  $("#modeBadge").innerHTML=`${S.local?`<span class="offline" title="Нет общей базы — данные только на этом устройстве">Офлайн</span>`:""}<span class="ai-status ${S.sample?"ready":""}" title="${S.sample?"ИИ подключён через Claude":"ИИ доступен при открытии приложения в Claude"}">${S.sample?"ИИ Claude":"ИИ: Claude"}</span>`;
}
function go(tab){
  if(S.simpleView&&!["home","map","events"].includes(tab)) tab="home";
  const previousTab=S.tab, changed=previousTab!==tab;
  const tabs=tabList().map(([id])=>id);
  const direction=tabs.indexOf(tab)>=tabs.indexOf(previousTab)?"next":"previous";
  S.tab=tab; document.querySelectorAll(".screen").forEach(s=>s.hidden = s.id!=="s-"+tab);
  renderTabs(); renderCurrent();
  const screen=$("#s-"+tab);
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(changed&&screen&&!reduceMotion){
    screen.classList.remove("screen-enter-next","screen-enter-previous");
    void screen.offsetWidth;
    screen.classList.add("screen-enter-"+direction);
    screen.addEventListener("animationend",event=>{
      if(event.target===screen) screen.classList.remove("screen-enter-next","screen-enter-previous");
    },{once:true});
  }
  window.scrollTo({top:0,behavior:changed&&!reduceMotion?"smooth":"auto"});
  $("#fab").hidden = S.simpleView||tab==="ai";
  MAP.setActive(tab==="map");
}
function renderCurrent(){
  if(!S.pub) return;
  ({home:renderHome,map:renderMapScreen,events:renderEvents,rank:renderRank,pet:renderPet,ai:renderAIScreen})[S.tab]?.();
}

/* ============ sheet ============ */
function openSheet(html, onMount){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet wrap" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeSheet(); });
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  document.body.style.overflow="hidden";
  onMount && onMount(root.querySelector(".sheet"));
}
function closeSheet(){ $("#sheetRoot").innerHTML=""; document.body.style.overflow=""; sheetAbort?.abort(); }
let sheetAbort=null;
const sheetHead = t => `<div class="sheet-h"><h2>${t}</h2><button class="x" type="button" data-close aria-label="Закрыть">${I.x}</button></div>`;

/* ============ derived ============ */
const okReports = () => S.reports.filter(r=>r.status==="ok");
function upcomingEvents(){ const now=Date.now()-6*3600e3; return S.events.filter(e=>new Date(e.date).getTime()>=now).sort((a,b)=>new Date(a.date)-new Date(b.date)); }
function spotPriority(s){ return (s.confirms?.length||0) + (s.severity||2) + (s.trusted?2:0); }
function visibleSpots(){ return S.spots.filter(s=>s.status!=="cleaned" && s.status!=="rejected").sort((a,b)=>spotPriority(b)-spotPriority(a)); }
function spotState(s){
  if(s.status==="cleaned") return ["Убрано","b-ok"];
  if(s.status==="active") return ["Подтверждено","b-bad"];
  return ["На проверке","b-warn"];
}
function petNow(){
  const p=S.priv?.pet||{food:70,mood:70,xp:0,ts:Date.now()};
  const h=(Date.now()-(p.ts||Date.now()))/3600e3;
  return {...p, food:clamp(Math.round(p.food-h*2),0,100), mood:clamp(Math.round(p.mood-h*1),0,100)};
}
const STAGES=[[0,"Семечко"],[30,"Росток"],[100,"Саженец"],[250,"Деревце"],[500,"Цветущая яблоня-апорт"]];
function petStage(xp){ let s=0; STAGES.forEach((st,i)=>{ if(xp>=st[0]) s=i; }); return s; }

/* ============ REPORT (photo → AI check → points) ============ */
function openReport(prefEvent){
  const R={blob:null,thumb:null,ai:null,counts:{bottles:0,cans:0,plastic:0,paper:0,glass:0,packets:0,other:0,trashBags:0},event:prefEvent||""};
  const myEvents=S.events.filter(e=>e.members?.includes(S.uid));
  openSheet(`${sheetHead("Я собрал мусор")}
    <p class="muted small">Сфотографируй собранный мусор целиком (мешки, бутылки). Лица и документы в кадр не нужны.</p>
    <label class="photo-drop" id="rDrop">${I.cam}<b>Сделать или выбрать фото</b><span class="small muted">JPG или PNG</span><input type="file" id="rFile" accept="image/*" capture="environment" hidden></label>
    <div id="rAI"></div>
    <div id="rCounts" hidden class="card gap-6"><h3>Сколько собрано</h3><div id="rSteps" class="stack-6"></div><p class="small muted" id="rPts"></p></div>
    ${myEvents.length?`<label class="f">Это было на субботнике? (+10 баллов)<select id="rEvent"><option value="">Нет, сам(а)</option>${myEvents.map(e=>`<option value="${e.id}" ${R.event===e.id?"selected":""}>${esc(e.title)}</option>`).join("")}</select></label>`:""}
    <button class="btn primary block" id="rSubmit" type="button" disabled>Отправить отчёт</button>`, sheet=>{
    const file=$("#rFile",sheet);
    file.onchange=async()=>{
      const f=file.files[0]; if(!f) return;
      try{ const {blob,thumb}=await processPhoto(f); R.blob=blob; R.thumb=thumb; }catch{ toast("Не удалось открыть фото"); return; }
      $("#rDrop",sheet).innerHTML=`<img src="${R.thumb}" alt="Ваше фото"><span class="small muted">Нажмите, чтобы заменить</span>`; $("#rDrop",sheet).appendChild(file);
      checkReport(sheet,R);
    };
    $("#rEvent",sheet)?.addEventListener("change",e=>{R.event=e.target.value; updPts(sheet,R);});
    $("#rSubmit",sheet).onclick=()=>submitReport(R);
  });
}
async function checkReport(sheet,R){
  const box=$("#rAI",sheet);
  if(!S.sample || !S.imgOK){
    R.ai={verdict:"review",summary:"ИИ-проверка недоступна в этом просмотре",reason:"Отчёт уйдёт на ручную проверку; баллы начислятся после неё."};
    renderAIResult(box,R.ai,"report"); showCounts(sheet,R); return;
  }
  box.innerHTML=`<div class="ai-box"><span class="ai-tag">${I.spark} ИИ проверяет фото</span><div class="row"><span class="spin"></span><span class="small">Ищем мусор и считаем предметы…</span></div></div>`;
  sheetAbort=new AbortController();
  try{
    const res=await aiJSON(PROMPT_REPORT,{images:[R.blob],signal:sheetAbort.signal,cache:false});
    R.ai=res||{verdict:"review"};
    for(const k of Object.keys(R.counts)) R.counts[k]=clamp(parseInt(res?.[k])||0,0,500);
  }catch(e){
    if(e.code==="cancelled") return;
    R.ai={verdict:"review",summary:"ИИ не смог проверить фото",reason:aiErrText(e)+" Отчёт уйдёт на ручную проверку."};
  }
  renderAIResult(box,R.ai,"report"); showCounts(sheet,R);
}
function renderAIResult(box,ai,kind){
  const v=ai.verdict, cls=v==="ok"?"ok":v==="reject"?"bad":"warn";
  const title= v==="ok" ? (kind==="report"?"Фото подтверждено":"Загрязнение подтверждено") : v==="reject" ? "Фото отклонено" : "Нужна проверка человеком";
  box.innerHTML=`<div class="ai-box ${cls}"><span class="ai-tag">${I.spark} ИИ-проверка${ai.confidence!=null?` · уверенность ${Math.round(ai.confidence*100)}%`:""}</span>
    <b>${title}</b>${ai.summary?`<p class="small">${esc(ai.summary)}</p>`:""}${v!=="ok"&&ai.reason?`<p class="small">${esc(ai.reason)}</p>`:""}
    ${kind==="spot"&&ai.kind?`<div class="row wrap-ok"><span class="badge b-plain">${esc(ai.kind)}</span><span class="badge b-plain">Серьёзность ${clamp(+ai.severity||2,1,5)}/5</span></div>`:""}</div>`;
}
function showCounts(sheet,R){
  if(R.ai.verdict==="reject"){ $("#rCounts",sheet).hidden=true; $("#rSubmit",sheet).disabled=true; return; }
  $("#rCounts",sheet).hidden=false;
  const wrap=$("#rSteps",sheet);
  wrap.innerHTML=Object.keys(R.counts).map(k=>`<div class="stepper"><span>${ITEM_LABELS[k]}</span><button type="button" data-k="${k}" data-d="-1" aria-label="Меньше">−</button><b id="c-${k}">${R.counts[k]}</b><button type="button" data-k="${k}" data-d="1" aria-label="Больше">+</button></div>`).join("");
  wrap.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; R.counts[k]=clamp(R.counts[k]+(+b.dataset.d),0,500); $("#c-"+k,sheet).textContent=R.counts[k]; R.edited=true; updPts(sheet,R); });
  updPts(sheet,R);
}
function calcPts(R){ let p=0; for(const k in R.counts) p+=R.counts[k]*PTS[k]; if(R.event) p+=10; return p; }
function calcItems(c){ return Object.entries(c).reduce((total,[kind,count])=>total+(kind==="trashBags"?count*10:count),0); }
function updPts(sheet,R){
  const p=calcPts(R), items=calcItems(R.counts);
  $("#rPts",sheet).innerHTML = R.ai.verdict==="ok" ? `Будет начислено <b>${p}</b> ${plural(p,"балл","балла","баллов")} · ${items} ${plural(items,"предмет","предмета","предметов")}${R.edited?" · вы изменили подсчёт ИИ, отчёт отметится":""}` : `Отчёт уйдёт на проверку, баллы — после неё.`;
  $("#rSubmit",sheet).disabled = items===0;
}
async function submitReport(R){
  const btn=$("#rSubmit"); btn.disabled=true;
  const status=R.ai.verdict==="ok"?"ok":"review";
  const pts=status==="ok"?calcPts(R):0, items=calcItems(R.counts);
  const rep={uid:S.uid,name:S.pub.name,team:S.pub.team||null,league:S.pub.league||null,school:S.pub.group==="school"?S.pub.org:null,district:S.pub.district,counts:R.counts,items,points:pts,status,edited:!!R.edited,ai:{verdict:R.ai.verdict,summary:R.ai.summary||"",confidence:R.ai.confidence??null},photo:R.thumb,event:R.event||null,at:Date.now(),day:dayKey()};
  try{
    await Store.add("reports",rep);
    const pet=petNow();
    const fed={...pet, food:clamp(pet.food+Math.max(10,items*3),0,100), mood:clamp(pet.mood+10,0,100), xp:pet.xp+Math.min(60,items), ts:Date.now()};
    await saveMe(status==="ok"?{points:(S.pub.points||0)+pts, items:(S.pub.items||0)+items}:null, {pet:fed});
    closeSheet();
    toast(status==="ok"?`+${pts} ${plural(pts,"балл","балла","баллов")}! ${isKid()?"Жасыл сыт и счастлив.":"Спасибо за чистый город."}`:"Отчёт отправлен на проверку");
    renderCurrent();
  }catch(e){ btn.disabled=false; toast("Не удалось отправить: "+(e.code||"ошибка")); }
}

const LNG0=76.92, LAT0=43.255, KX=81.1, KZ=111.2;

function vnoise(x,z){ const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi; const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);

function heightAt(x,z){
  let h=(z+14)*0.012;
  const m=sstep(5.6,11,z+Math.sin(x*0.35)*1.2);
  const ridge=1-Math.abs(fbm(x*0.22+3,z*0.22)*2-1);
  h+=m*(0.6+3.2*ridge*sstep(5,14,z)+0.6*fbm(x*0.5,z*0.5));
  const kt=Math.hypot(x-4.6,z-2.4); h+=0.45*Math.exp(-kt*kt/2.2); // Кок-Тобе
  return h;
}

    scene.add(new THREE.HemisphereLight(0xffffff, dark?0x1b2a20:0x8aa58f, dark?0.75:0.85));
    const sun=new THREE.DirectionalLight(0xfff2d6, dark?0.6:0.9); sun.position.set(-10,20,-6); scene.add(sun);
    // terrain
    const geo=new THREE.PlaneGeometry(34,30,170,150); geo.rotateX(-Math.PI/2); geo.translate(0,0,-0.5);
    const pos=geo.attributes.position, cols=[];

    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i), z=pos.getZ(i), h=heightAt(x,z); pos.setY(i,h);
      const m=sstep(5.6,11,z+Math.sin(x*0.35)*1.2); let c=cCity.clone();
      const g=fbm(x*0.6+9,z*0.6); if(g>0.62) c.lerp(cPark,0.6);

      g.fillStyle=dark?"rgba(13,23,17,.72)":"rgba(255,255,255,.82)"; const r=20; g.beginPath(); g.moveTo(r,0); g.arcTo(w,0,w,c.height,r); g.arcTo(w,c.height,0,c.height,r); g.arcTo(0,c.height,0,0,r); g.arcTo(0,0,w,0,r); g.fill();

    DISTRICTS.forEach(d=>{ const [x,z]=toXZ(d.lat,d.lng); label(d.name,x,z,1.0,0.62); });
    label("Кок-Тобе",4.6,2.4,1.2,0.5,dark?"#93dba5":"#1d5c36");
    label("Заилийский Алатау",1,12.5,1.6,0.75,dark?"#93dba5":"#1d5c36");
    label("Медеу",6.2,9.5,1.2,0.5,dark?"#93dba5":"#1d5c36");

/* ============ RANK / COMPETITIONS / REWARDS ============ */
function leaderboard(league){
  const m=new Map();
  for(const r of okReports()){
    let key;
    if(league==="district") key=districtName(r.district);
    else if(league==="people") key=r.uid;
    else if(league==="school") key=reportSchool(r);
    else { if(r.league!==league||!r.team) continue; key=r.team; }
    if(!key) continue;
    const o=m.get(key)||{key,points:0,items:0,name:league==="people"?r.name:key}; o.points+=r.points||0; o.items+=r.items||0; m.set(key,o);
  }
  return [...m.values()].sort((a,b)=>b.points-a.points);
}
function reportSchool(report){
  if(report.school) return report.school;
  const profile=S.profiles.find(p=>p.id===report.uid);
  return profile&&(profile.group==="school"||profile.role==="teacher")?profile.org:null;
}

async function removeConnection(id){
  const connections=S.priv.connections||[], next=connections.filter(c=>c.id!==id);
  if(next.length===connections.length) return;
  try{
    await Store.set(privPath(),{...S.priv,connections:next});
    S.priv={...S.priv,connections:next};
    renderRank(); toast("Контакт удалён");
  }catch(e){ toast("Не удалось удалить: "+(e.code||"ошибка")); }
}
function battleScore(b,side){
  const name=side==="a"?b.a:b.b;
  return okReports().filter(r=>{
    if(r.day!==b.date) return false;
    if(b.mode==="friend"){
      const memberIds=side==="a"?b.aUids:b.bUids;
      return memberIds?memberIds.includes(r.uid):r.uid===(side==="a"?b.aUid:b.bUid);
    }
    if(b.mode==="school") return reportSchool(r)===name;
    return r.team===name;
  }).reduce((a,r)=>a+(r.items||0),0);
}

  const root=$("#s-rank");
  applyPercentValues(root);
  root.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ S.rankLeague=b.dataset.l; renderRank(); });
  root.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>redeem(b.dataset.rw));
  $("#connectionNew").onclick=openConnection;
  root.querySelectorAll("[data-remove-connection]").forEach(b=>b.onclick=()=>removeConnection(b.dataset.removeConnection));
  $("#btNew")&&($("#btNew").onclick=openBattle);
  $("#rkAI").onclick=async()=>{
    const out=$("#rkAIOut"), b=$("#rkAI"); b.disabled=true; out.textContent="ИИ думает…";
    const data={league:L,top:lb.slice(0,10).map(r=>({name:L==="people"?"участник":r.name,points:r.points,items:r.items})),myTeam:S.pub.team,battles:battles.map(x=>({a:x.a,b:x.b,date:x.date,scoreA:battleScore(x,"a"),scoreB:battleScore(x,"b")}))};
    try{ const {text}=await aiText(`Ты — спортивный комментатор эко-соревнований «Таза Алматы». Данные: ${JSON.stringify(data)}. По-русски, до 80 слов, списком "- ": кто лидирует, кто быстро растёт или отстаёт, что сделать команде «${S.pub.team||"пользователя"}», чтобы подняться. Опирайся только на данные; если их мало — подбодри начать.`,{onText:({text})=>{out.innerHTML=md(text);}}); out.innerHTML=md(text); }
    catch(e){ out.textContent=aiErrText(e); } b.disabled=false;
  };
}
async function redeem(id){
  const r=REWARDS.find(x=>x.id===id); if(!r||balance()<r.cost) return;
  const code="TAZA-"+Math.random().toString(36).slice(2,7).toUpperCase();
  await saveMe(null,{spent:(S.priv.spent||0)+r.cost, rewards:[...(S.priv.rewards||[]),{t:r.t,code,at:Date.now()}]});
  toast("Код получен: "+code); renderRank();
}
function openBattle(){
  const modes=[];
  if(S.pub.league==="class"&&S.pub.team) modes.push(["class","Класс"]);
  if((S.pub.group==="school"||S.pub.role==="teacher")&&S.pub.org) modes.push(["school","Школа"]);
  if(S.pub.league==="company"&&S.pub.team) modes.push(["company","Компания"]);
  modes.push(["friend","Друг"]);
  const labels={class:"Класс против класса",school:"Школа против школы",company:"Компания против компании",friend:"Друг против друга"};
  const today=dayKey(), nextDay=new Date(); nextDay.setDate(nextDay.getDate()+1);
  const tomorrow=dayKey(nextDay);
  const teamsFor=mode=>{
    if(mode==="school") return [...new Set([...S.profiles.filter(p=>(p.group==="school"||p.role==="teacher")&&p.org).map(p=>p.org),...S.reports.map(r=>r.school).filter(Boolean)])].filter(t=>t!==S.pub.org);
    const league=mode==="friend"?null:mode;
    return [...new Set([...S.profiles.filter(p=>p.league===league&&p.team).map(p=>p.team),...S.reports.filter(r=>r.league===league&&r.team).map(r=>r.team)])].filter(t=>t!==S.pub.team);
  };
  const modeField=()=>`<label class="f">Формат соревнования<select id="btMode">${modes.map(([id])=>`<option value="${id}">${labels[id]}</option>`).join("")}</select></label>`;
  openSheet(`${sheetHead("Бросить вызов")}
    ${modeField()}
    <p class="small muted" id="btMine"></p>
    <div id="btOpponent"></div>
    <label class="f">Дата<input type="date" id="btD" value="${tomorrow}" min="${today}"></label>
    <label class="f">Название<input type="text" id="btT" maxlength="50" placeholder="Кто соберёт больше бутылок"></label>
    <p class="small muted" id="btErr" role="alert"></p>
    <button class="btn primary block" type="button" id="btSave">Бросить вызов</button>`, sheet=>{
    let friendSides=null;
    const drawOpponent=()=>{
      const mode=$("#btMode",sheet).value;
      const mine=mode==="friend"?S.pub.name:mode==="school"?S.pub.org:S.pub.team;
      $("#btMine",sheet).innerHTML=mode==="friend"?"Добавьте участников в обе команды. Участник может быть только в одной команде.":`Ваша сторона: <b>${esc(mine||"профиль")}</b>`;
      if(mode==="friend"){
        const friends=(S.priv.connections||[]).filter(c=>c.profileId).map(c=>{
          const profile=S.profiles.find(p=>p.id===c.profileId);
          return profile?{...profile,relation:c.relation}:null;
        }).filter(Boolean);
        const sides={a:[S.uid],b:[]};
        friendSides=sides;
        const renderFriends=()=>{
          const names=ids=>ids.map(id=>friends.find(p=>p.id===id)?.name||(id===S.uid?S.pub.name:"")).filter(Boolean);
          const sideMarkup=(side,title)=>`<fieldset class="team-pick"><legend>${title} · ${names(sides[side]).length} участн.</legend>
            ${friends.length?friends.map(p=>`<label><input type="checkbox" data-side="${side}" value="${esc(p.id)}" ${sides[side].includes(p.id)?"checked":""} ${sides[side==="a"?"b":"a"].includes(p.id)?"disabled":""}><span>${esc(p.name)} · ${esc(relationshipName(p.relation))}${p.team?" · "+esc(p.team):""}</span></label>`).join(""):'<span class="small muted">Добавьте близкого и привяжите его аккаунт участника.</span>'}
          </fieldset>`;
          $("#btOpponent",sheet).innerHTML=`<div class="friend-teams">${sideMarkup("a","Ваша команда")} ${sideMarkup("b","Команда друзей")}</div>`;
          $("#btOpponent",sheet).querySelectorAll("[data-side]").forEach(input=>input.onchange=()=>{
            const side=input.dataset.side, ids=sides[side];
            sides[side]=input.checked?[...ids,input.value]:ids.filter(id=>id!==input.value);
            renderFriends();
          });
          $("#btSave",sheet).disabled=!sides.a.length||!sides.b.length;
        };
        renderFriends();
      }else{
        friendSides=null;
        const teams=teamsFor(mode), own=mode==="school"?S.pub.org:S.pub.team;
        $("#btOpponent",sheet).innerHTML=`<label class="f">Соперник<input type="text" id="btTeam" list="btList" maxlength="60" placeholder="${mode==="school"?"Название школы":mode==="class"?"Название класса":"Название компании"}" required><datalist id="btList">${teams.map(t=>`<option value="${esc(t)}">`).join("")}</datalist></label>`;
        $("#btTeam",sheet).value="";
        $("#btSave",sheet).disabled=!own;
      }
    };
    $("#btMode",sheet).onchange=drawOpponent;
    drawOpponent();
    $("#btSave",sheet).onclick=async()=>{
      const mode=$("#btMode",sheet).value, date=$("#btD",sheet).value;
      if(!date){ $("#btErr",sheet).textContent="Укажите дату соревнования."; return; }
      let battle;
      if(mode==="friend"){
        const sides=friendSides;
        const members=ids=>ids.map(id=>({id,name:S.profiles.find(p=>p.id===id)?.name||(id===S.uid?S.pub.name:"")})).filter(p=>p.name);
        const a=members(sides?.a||[]), b=members(sides?.b||[]);
        if(!a.length||!b.length){ $("#btErr",sheet).textContent="Добавьте хотя бы одного участника в каждую команду."; return; }
        battle={mode,a:a.map(p=>p.name).join(" + "),b:b.map(p=>p.name).join(" + "),aUids:a.map(p=>p.id),bUids:b.map(p=>p.id)};
      }else{
        const a=mode==="school"?S.pub.org:S.pub.team, b=$("#btTeam",sheet).value.trim();
        if(!a){ $("#btErr",sheet).textContent="Укажите школу, класс или компанию в профиле."; return; }
        if(!b||b===a){ $("#btErr",sheet).textContent="Укажите другого соперника."; return; }
        battle={mode,a,b};
      }
      try{ await Store.add("battles",{...battle,date,title:$("#btT",sheet).value.trim()||"Кто соберёт больше",uid:S.uid,at:Date.now()}); closeSheet(); toast("Вызов создан!"); }
      catch(e){ $("#btErr",sheet).textContent="Не удалось: "+(e.code||"ошибка"); }
    };
  });
}

/* ============ PET (eco-tamagotchi) ============ */
function petSVG(stage,food,mood,size){
  const hungry=food<35, sad=mood<35;
  const body=hungry?"color-mix(in srgb,var(--sun) 55%,#b9b39a)":"var(--sun)";
  const leaves=["", `<path d="M60 22c-2-12 6-18 14-16-1 10-8 16-14 16z" fill="var(--leaf)"/>`,
    `<path d="M60 22c-2-12 6-18 14-16-1 10-8 16-14 16z" fill="var(--leaf)"/><path d="M58 22c-8-8-16-6-18 0 8 4 14 3 18 0z" fill="var(--leaf)"/>`,
    `<path d="M60 24V6" stroke="var(--forest)" stroke-width="3"/><path d="M60 12c0-10 10-14 16-10-2 8-9 11-16 10z" fill="var(--leaf)"/><path d="M60 16c-6-8-15-8-18-3 7 5 13 5 18 3z" fill="var(--leaf)"/><path d="M60 8c4-6 2-8 0-8-3 2-3 5 0 8z" fill="var(--leaf)"/>`,
    `<path d="M60 26V8" stroke="var(--forest)" stroke-width="3"/><circle cx="60" cy="6" r="14" fill="var(--leaf)"/><circle cx="46" cy="14" r="10" fill="var(--leaf)"/><circle cx="74" cy="14" r="10" fill="var(--leaf)"/><circle cx="52" cy="4" r="3" fill="#f6b7c1"/><circle cx="68" cy="8" r="3" fill="#f6b7c1"/><circle cx="60" cy="-2" r="3" fill="#f6b7c1"/><circle cx="76" cy="16" r="3.2" fill="var(--berry)"/>`][stage];
  const mouth = sad||hungry ? `<path d="M50 78c6-5 14-5 20 0" stroke="#1b2a1f" stroke-width="3" fill="none" stroke-linecap="round"/>` : `<path d="M48 72c7 8 17 8 24 0" stroke="#1b2a1f" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const eyes = hungry ? `<path d="M40 60h10M70 60h10" stroke="#1b2a1f" stroke-width="3" stroke-linecap="round"/>` : `<circle cx="45" cy="60" r="5" fill="#1b2a1f"/><circle cx="75" cy="60" r="5" fill="#1b2a1f"/><circle cx="47" cy="58" r="1.6" fill="#fff"/><circle cx="77" cy="58" r="1.6" fill="#fff"/>`;
  return `<svg class="${size?"":"pet-svg"}" ${size?`width="${size}" height="${size}"`:""} viewBox="0 -18 120 136" role="img" aria-label="Эко-питомец">
    <ellipse cx="60" cy="112" rx="34" ry="6" fill="#000" opacity=".1"/>
    ${leaves}
    <path d="M60 20C34 20 20 46 20 70s18 40 40 40 40-16 40-40S86 20 60 20z" fill="${body}"/>
    <ellipse cx="36" cy="74" rx="7" ry="4" fill="var(--berry)" opacity="${sad?0:.35}"/><ellipse cx="84" cy="74" rx="7" ry="4" fill="var(--berry)" opacity="${sad?0:.35}"/>
    ${eyes}${mouth}</svg>`;
}
function renderPet(){
  const pet=petNow(), st=petStage(pet.xp), next=STAGES[st+1];
  const mood = pet.food<35?"Я проголодался… Собери немного мусора — так я питаюсь!" : pet.mood<35?"Мне скучно. Ответишь на мой вопрос?" : "Мне хорошо! Давай узнаем что-то новое про природу.";
  $("#s-pet").innerHTML=`<div><p class="eyebrow">Эко-тамагочи</p><h1>${esc(pet.name||"Жасыл")}</h1></div>
    <div class="pet-stage">${petSVG(st,pet.food,pet.mood)}
      <div class="msg bot pet-message">${mood}</div>
      <span class="badge b-ok">${STAGES[st][1]}${next?` · до «${next[1]}» ${next[0]-pet.xp} XP`:""}</span></div>
    <div class="card stack-8">
      <div class="row between small"><span>Сытость</span><b class="num">${pet.food}%</b></div><div class="bar"><i class="fill-leaf" data-percent="${pet.food}"></i></div>
      <div class="row between small"><span>Настроение</span><b class="num">${pet.mood}%</b></div><div class="bar"><i class="fill-sun" data-percent="${pet.mood}"></i></div>
      <div class="row between small"><span>Опыт</span><b class="num">${pet.xp} XP</b></div></div>
    <div class="grid2"><button class="btn primary" type="button" id="ptFeed">${I.cam} Покормить</button><button class="btn sun" type="button" id="ptQ">${I.spark} Вопрос</button></div>
    <div id="quizBox"></div>
    <div class="card"><h2>Поболтать с питомцем</h2><div class="chat" id="petChat">${S.petTurns.length?S.petTurns.map(t=>`<div class="msg ${t.role==="user"?"me":"bot"}">${esc(t.content)}</div>`).join(""):`<div class="msg bot">Привет! Я ${esc(pet.name||"Жасыл")}, маленький росток из Алматы. Спроси меня о природе!</div>`}</div>
      <form class="composer" id="petForm"><input type="text" id="petIn" maxlength="200" placeholder="Напиши Жасылу…" autocomplete="off"><button class="btn primary" type="submit" aria-label="Отправить">${I.send}</button></form></div>`;
  applyPercentValues($("#s-pet"));
  $("#ptFeed").onclick=()=>openReport();
  $("#ptQ").onclick=askQuiz;
  $("#petForm").onsubmit=petChat;
  if(S.quiz) drawQuiz();
}
async function askQuiz(){
  const b=$("#ptQ"); b.disabled=true;
  const box=$("#quizBox"); box.innerHTML=`<div class="card"><div class="row"><span class="spin"></span><span class="small">${esc(petNow().name||"Жасыл")} придумывает вопрос…</span></div></div>`;
  const topic=QUIZ_TOPICS[Math.floor(Math.random()*QUIZ_TOPICS.length)];
  const who={kid:"дошкольника 5–6 лет (очень просто)",school:"школьника",teen:"подростка",adult:"взрослого",senior:"взрослого"}[S.pub.group]||"школьника";
  let q=null;
  try{
    q=await aiJSON(`Ты — Жасыл, добрый эко-тамагочи из Алматы. Придумай 1 вопрос викторины для ${who} на тему «${topic}». Факты должны быть общеизвестными и верными; для времени разложения указывай «примерно». Не повторяй вопросы: ${S.quizSeen.slice(-6).join(" | ")||"—"}.
Верни ТОЛЬКО JSON: {"question":"…","options":["…","…","…","…"],"correct":индекс 0-3,"fact":"1–2 предложения интересного объяснения"}`,{modelTier:"quick",cache:false});
    if(!q||!Array.isArray(q.options)||q.options.length<2||typeof q.correct!=="number") q=null;
  }catch(e){ if(e.code==="not_granted"||e.code==="unavailable") toast("ИИ недоступен — вопрос из базы Жасыла"); }
  if(!q){ const pool=QUIZ_BANK.filter(x=>!S.quizSeen.includes(x.question)); q=(pool.length?pool:QUIZ_BANK)[Math.floor(Math.random()*(pool.length||QUIZ_BANK.length))]; }
  S.quizSeen.push(q.question); S.quiz={...q,answered:null};
  drawQuiz(); b.disabled=false;
}
function drawQuiz(){
  const q=S.quiz, box=$("#quizBox"); if(!q||!box) return;
  box.innerHTML=`<div class="card"><span class="ai-tag">${I.spark} Вопрос от Жасыла</span><h3 class="quiz-title">${esc(q.question)}</h3>
    <div class="stack-8">${q.options.map((o,i)=>`<button type="button" class="quiz-opt ${q.answered!=null?(i===q.correct?"right":i===q.answered?"wrong":""):""}" data-q="${i}" ${q.answered!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
    ${q.answered!=null?`<div class="ai-box ${q.answered===q.correct?"ok":"warn"}"><b>${q.answered===q.correct?"Верно! +5 XP, +1 балл":"Почти! Правильный ответ подсвечен"}</b><p class="small">${esc(q.fact||"")}</p></div>`:""}</div>`;
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=async()=>{
    q.answered=+b.dataset.q; const right=q.answered===q.correct; drawQuiz();
    const pet=petNow(); await saveMe(right?{points:(S.pub.points||0)+1}:null,{pet:{...pet,mood:clamp(pet.mood+(right?12:4),0,100),xp:pet.xp+(right?5:1),ts:Date.now()}});
    if(S.tab==="pet"){ const keep=S.quiz; renderPet(); S.quiz=keep; drawQuiz(); }
  });
}
async function petChat(ev){
  ev.preventDefault(); const inp=$("#petIn"), text=inp.value.trim(); if(!text) return; inp.value="";
  const pet=petNow(), chat=$("#petChat");
  S.petTurns.push({role:"user",content:text}); S.petTurns=S.petTurns.slice(-12);
  chat.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(text)}</div><div class="msg bot" id="petLive">…</div>`);
  const rules=`Ты — ${pet.name||"Жасыл"}, эко-тамагочи в приложении «Таза Алматы»: маленький солнечный росток из Алматы. Собеседник: ${({kid:"дошкольник",school:"школьник",teen:"подросток",adult:"взрослый",senior:"пожилой человек"})[S.pub.group]} по имени ${S.pub.name}. Говори по-русски, коротко (1–3 предложения), тепло и просто. Твоя сытость ${pet.food}%, настроение ${pet.mood}%: если голоден — мягко попроси собрать мусор, ведь ты питаешься собранным мусором. Иногда задавай встречный вопрос про природу или отходы. Никогда не спрашивай адрес, школу, телефон или фото людей и не предлагай встречаться. Если собеседник пишет о чём-то опасном или грустном — бережно посоветуй рассказать взрослому, которому он доверяет. Отвечай только как ${pet.name||"Жасыл"}.`;
  try{
    const {text:ans}=await aiText([{role:"user",content:rules},{role:"assistant",content:"Поняла, отвечаю как эко-питомец."},...S.petTurns],{cache:false,modelTier:"quick",onText:({text})=>{ const l=$("#petLive"); if(l) l.textContent=text; }});
    S.petTurns.push({role:"assistant",content:ans});
  }catch(e){ S.petTurns.pop(); const l=$("#petLive"); if(l) l.textContent=aiErrText(e); return; }
  $("#petLive")?.removeAttribute("id");
}

/* ============ AI ASSISTANT ============ */
function assistantContext(){
  return `Пользователь: ${S.pub.name}, группа ${S.pub.group}, роль ${S.pub.roleTitle}, район ${districtName(S.pub.district)}, команда ${S.pub.team||"нет"}, баллы ${balance()}.
Данные приложения: ${visibleSpots().length} активных точек загрязнения (топ: ${visibleSpots().slice(0,4).map(s=>(s.title||s.kind)+" — "+districtName(s.district)).join("; ")||"нет"}); ближайшие субботники: ${upcomingEvents().slice(0,3).map(e=>e.title+", "+districtName(e.district)+", "+fmtDate(e.date)).join("; ")||"нет"}.`;
}
const AI_RULES=()=>`Ты — ИИ-ассистент приложения «Таза Алматы» (экология Алматы: субботники, карта загрязнений, соревнования, сортировка). Отвечай по-русски, кратко и по делу, с конкретными шагами, списком "- " где уместно. Не выдумывай адреса, телефоны и названия конкретных пунктов приёма: если нужен адрес — посоветуй проверить в 2ГИС или в акимате района. ${isKid()?"Собеседник — ребёнок: пиши просто и бережно, без страшных подробностей.":""}\n${assistantContext()}`;
const QUICK=["Как правильно сортировать мусор дома?","Придумай субботник для нашего класса","Где в карте сейчас хуже всего?","Как убедить коллег участвовать?"];
function chatHTML(){ return S.aiTurns.length?S.aiTurns.map(t=>`<div class="msg ${t.role==="user"?"me":"bot"} ${t.role==="user"?"":"md"}">${t.role==="user"?esc(t.content):md(t.content)}</div>`).join(""):`<div class="msg bot">Привет! Я помогу с сортировкой, субботниками и разбором карты загрязнений. Спросите что угодно.</div>`; }
function assistantBody(){
  return `${S.sample?"":`<div class="ai-box warn"><b>ИИ подключается через Claude</b><span class="small">Откройте приложение внутри Claude, чтобы задавать вопросы, получать планы и проверять фото с помощью ИИ.</span></div>`}
    <div class="chips">${QUICK.map(q=>`<button type="button" class="chip" data-qk="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="chat" id="aiChat">${chatHTML()}</div>
    <form class="composer" id="aiForm"><input type="text" id="aiIn" maxlength="500" placeholder="Спросите ИИ…" autocomplete="off"><button class="btn primary" type="submit" aria-label="Отправить">${I.send}</button></form>`;
}
function bindAssistant(root){
  root.querySelectorAll("[data-qk]").forEach(b=>b.onclick=()=>{ $("#aiIn",root).value=b.dataset.qk; sendAI(root); });
  $("#aiForm",root).onsubmit=e=>{ e.preventDefault(); sendAI(root); };
}
function openAssistant(){ openSheet(`${sheetHead("ИИ-ассистент")}${assistantBody()}`, sheet=>bindAssistant(sheet)); }
function renderAIScreen(){
  const el=$("#s-ai");
  el.innerHTML=`<div><p class="eyebrow">Помощник и аналитика</p><h1>ИИ-ассистент</h1></div><div class="card">${assistantBody()}</div>`;
  bindAssistant(el);
}
async function sendAI(root){
  const inp=$("#aiIn",root), text=inp.value.trim(); if(!text) return; inp.value="";
  S.aiTurns.push({role:"user",content:text}); S.aiTurns=S.aiTurns.slice(-14);
  const chat=$("#aiChat",root); chat.innerHTML=chatHTML()+`<div class="msg bot md" id="aiLive">ИИ думает…</div>`;
  try{
    const {text:ans}=await aiText([{role:"user",content:AI_RULES()},{role:"assistant",content:"Понял. Готов помогать."},...S.aiTurns],{cache:false,onText:({text})=>{ const l=$("#aiLive",root); if(l) l.innerHTML=md(text); }});
    S.aiTurns.push({role:"assistant",content:ans}); chat.innerHTML=chatHTML();
  }catch(e){ S.aiTurns.pop(); const l=$("#aiLive",root); if(l) l.textContent=aiErrText(e); }
  chat.lastElementChild?.scrollIntoView({block:"nearest",behavior:"smooth"});
}

boot();
</script>
